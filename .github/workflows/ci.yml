name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version Flutter épinglée (.fvmrc)
        id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true

      - name: Dépendances (lockfile commité)
        run: flutter pub get --enforce-lockfile

      - name: Analyse
        run: flutter analyze --no-pub

      - name: Tests (dont contrôle des imports)
        run: flutter test --no-pub

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Auto-vérification du plugin Hermes de notifications
        run: python server/hermes-plugin/hermes-mobile-notify/__init__.py

      - name: Contrats vendorisés du notifier (dérive)
        run: python server/notifier/sync_contracts.py --check

      - name: Tests du notifier
        run: |
          python -m pip install -r server/notifier/requirements.txt -r server/notifier/requirements-dev.txt
          python -m unittest discover -s server/notifier/tests -t server/notifier

      # Le packaging statique ne prouve pas que l'image démarre : construire
      # et exécuter le conteneur, puis charger les contrats embarqués.
      - name: Image du notifier (build et smoke)
        run: |
          docker build -f server/notifier/Dockerfile -t hermes-notifier:ci server/notifier
          docker run --rm hermes-notifier:ci python -m hermes_notifier --version
          docker run --rm hermes-notifier:ci python -c "from pathlib import Path; from hermes_notifier.contracts import Contracts; Contracts.load(Path('vendor/contracts'))"
          docker run --rm --entrypoint sh hermes-notifier:ci -c "test -x /run.sh"

      - name: Tests du lien et du QR
        run: |
          python -m pip install -r tool/requirements.txt
          python -m unittest discover -s tool -p 'test_*.py'

      # Pas de clé de signature en CI : build debug uniquement.
      - name: Build Android sans configuration Firebase
        run: |
          test ! -f android/app/google-services.json
          flutter build apk --debug --no-pub

      # Sans android/key.properties, le build release doit être refusé.
      - name: Refus du release non signé
        run: |
          if flutter build apk --release > release.log 2>&1; then
            echo "Le build release non signé aurait dû échouer."; cat release.log; exit 1
          fi
          grep -q "key.properties introuvable" release.log || { cat release.log; exit 1; }
