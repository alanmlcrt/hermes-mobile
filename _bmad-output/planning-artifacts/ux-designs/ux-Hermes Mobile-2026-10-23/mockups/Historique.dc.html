<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Conversations du profil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Inter, system-ui, sans-serif">
  <dc-import name="Conversation" dark="{{dark}}" hint-size="390px,844px"></dc-import>
  <a href="Conversation.dc.html" aria-label="Fermer" style="position: absolute; inset: 0; background: rgba(8, 10, 14, 0.45)"></a>

  <section role="dialog" aria-label="Conversations de Travail" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 640px; box-sizing: border-box; display: flex; flex-direction: column; padding: 8px 16px 20px; border-radius: 28px 28px 0 0; background: {{t.surface}}; color: {{t.text}}">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 999px; margin-bottom: 14px; background: {{t.line}}"></span>

    <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px 14px">
      <span style="flex: none; width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: #FFFFFF; background: {{accent}}">T</span>
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Travail</span>
        <span style="font-size: 13px; color: {{t.muted}}">12 conversations</span>
      </span>
      <a href="Reglages.dc.html" aria-label="Réglages du profil" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{t.chip}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      </a>
    </div>

    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 0; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; background: {{t.ink}}; color: {{t.onInk}}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      Nouvelle conversation
    </button>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="padding: 18px 4px 6px; font-size: 13px; font-weight: 600; color: {{t.muted}}">{{g.title}}</div>
      <sc-for list="{{g.items}}" as="c" hint-placeholder-count="3">
        <a href="Conversation.dc.html" aria-current="{{c.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 12px; border-radius: 16px; {{c.bg}}">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span>
            <span style="font-size: 13px; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.preview}}</span>
          </span>
          <span style="flex: none; font-size: 12px; color: {{t.muted}}">{{c.time}}</span>
        </a>
      </sc-for>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { surface: '#171A1F', chip: '#22262C', line: '#2A2F36', text: '#EEF0F3', muted: '#9AA3AE', ink: '#EEF0F3', onInk: '#111418' }
      : { surface: '#FFFFFF', chip: '#EDEFF2', line: '#E3E6EA', text: '#111418', muted: '#5B6470', ink: '#111418', onInk: '#FFFFFF' };
    const accent = '#1F7AE0';
    const row = (title, preview, time, current) => ({
      title, preview, time,
      current: current ? 'page' : 'false',
      bg: current ? 'background: ' + accent + (dark ? '33' : '1A') : '',
    });
    return {
      dark,
      t,
      accent,
      groups: [
        { title: 'Aujourd’hui', items: [
          row('Compte rendu réunion produit', 'Parfait, envoie-le à l’équipe', '08:12', true),
          row('Planning de la semaine', 'Jeudi est encore libre l’après-midi.', '07:40', false),
        ] },
        { title: 'Cette semaine', items: [
          row('Relecture de la page d’accueil', 'J’ai proposé trois titres.', 'Mar.', false),
          row('Budget du T4', 'Les chiffres sont à jour.', 'Lun.', false),
          row('Notes d’entretien', 'Résumé en cinq points.', 'Lun.', false),
        ] },
      ],
    };
  }
}
</script>
</body>
</html>
