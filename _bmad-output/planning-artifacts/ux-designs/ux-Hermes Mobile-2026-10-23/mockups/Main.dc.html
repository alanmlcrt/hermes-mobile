<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Hermes</h1>
    <div style="display: flex; gap: 8px">
      <button type="button" aria-label="Rechercher un profil" style="width: 44px; height: 44px; border: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{t.chip}}; color: {{t.text}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </button>
      <button type="button" aria-label="Profils et réglages" style="width: 44px; height: 44px; border: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{t.chip}}; color: {{t.text}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      </button>
    </div>
  </header>

  <section aria-label="Profils favoris" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 16px 20px 20px">
    <sc-for list="{{favorites}}" as="f" hint-placeholder-count="3">
      <a href="Conversation.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <span style="width: 64px; height: 64px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; color: #FFFFFF; background: {{f.color}}">{{f.initial}}</span>
        <span style="font-size: 14px; font-weight: 500; color: {{t.muted}}">{{f.name}}</span>
      </a>
    </sc-for>
  </section>

  <div style="padding: 4px 20px 8px; font-size: 13px; font-weight: 600; color: {{t.muted}}">Conversations récentes</div>

  <section aria-label="Profils" style="display: flex; flex-direction: column">
    <sc-for list="{{profiles}}" as="p" hint-placeholder-count="5">
      <a href="Conversation.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 12px 20px">
        <span style="flex: none; width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: #FFFFFF; background: {{p.color}}">{{p.initial}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
            <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
            <span style="flex: none; font-size: 13px; color: {{t.muted}}">{{p.time}}</span>
          </span>
          <span style="font-size: 15px; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.preview}}</span>
        </span>
      </a>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#0E1013', surface: '#171A1F', chip: '#22262C', text: '#EEF0F3', muted: '#9AA3AE', line: '#2A2F36' }
      : { bg: '#F7F8FA', surface: '#FFFFFF', chip: '#EDEFF2', text: '#111418', muted: '#5B6470', line: '#E3E6EA' };
    return {
      t,
      favorites: [
        { name: 'Principal', initial: 'P', color: '#5A62F8' },
        { name: 'Travail', initial: 'T', color: '#1F7AE0' },
        { name: 'Maison', initial: 'M', color: '#00897B' },
      ],
      profiles: [
        { name: 'Travail', initial: 'T', color: '#1F7AE0', time: '08:41', preview: 'Le compte rendu de réunion est prêt.' },
        { name: 'Principal', initial: 'P', color: '#5A62F8', time: '08:22', preview: 'Demain à Lisbonne : grand soleil le matin.' },
        { name: 'Recherche', initial: 'R', color: '#7958F5', time: 'Hier', preview: 'J’ai trouvé 4 articles sur le sujet.' },
        { name: 'Maison', initial: 'M', color: '#00897B', time: 'Hier', preview: 'Liste de courses mise à jour.' },
        { name: 'Code', initial: 'C', color: '#E25C12', time: '21/10', preview: 'Les tests passent sur la branche.' },
        { name: 'Écriture', initial: 'É', color: '#D63A74', time: '18/10', preview: 'Aucune conversation pour l’instant' },
      ],
    };
  }
}
</script>
</body>
</html>
