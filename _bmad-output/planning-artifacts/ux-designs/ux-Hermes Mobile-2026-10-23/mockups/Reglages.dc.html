<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réglages du profil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px">
    <a href="Conversation.dc.html" aria-label="Retour à la conversation" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{t.chip}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 16px; font-weight: 600">Réglages du profil</span>
    <span style="width: 44px"></span>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 6px 16px 16px">
    <section style="display: flex; flex-direction: column; align-items: center; padding: 28px 16px 24px; border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.line}}">
      <span style="width: 88px; height: 88px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 600; color: #FFFFFF; background: {{accent}}">T</span>
      <h1 style="margin: 14px 0 2px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Travail</h1>
      <p style="margin: 0; font-size: 14px; color: {{t.muted}}">Nom repris du profil Hermes</p>
    </section>

    <section style="padding: 16px; border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.line}}">
      <h2 style="margin: 0 0 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.muted}}">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: {{accent}}"><circle cx="12" cy="12" r="9"></circle><circle cx="8.5" cy="10" r="1.2"></circle><circle cx="12" cy="7.5" r="1.2"></circle><circle cx="15.5" cy="10" r="1.2"></circle></svg>
        Apparence
      </h2>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div>
          <div style="font-size: 15px; font-weight: 500">Couleur du profil</div>
          <div style="font-size: 13px; color: {{t.muted}}">Avatar, bouton d’envoi, repères</div>
        </div>
        <div role="radiogroup" aria-label="Couleur du profil" style="display: flex; gap: 6px">
          <sc-for list="{{swatches}}" as="s" hint-placeholder-count="6">
            <button type="button" role="radio" aria-checked="{{s.selected}}" aria-label="{{s.label}}" onClick="{{s.pick}}" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center">
              <span style="width: 30px; height: 30px; border-radius: 999px; background: {{s.color}}; {{s.ring}}"></span>
            </button>
          </sc-for>
        </div>
      </div>
    </section>

    <section style="border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.line}}; overflow: hidden">
      <h2 style="margin: 0; padding: 16px 16px 4px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.muted}}">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: {{accent}}"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
        Profil
      </h2>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px">
        <span style="font-size: 15px; font-weight: 500">Identifiant</span>
        <span style="font-size: 14px; color: {{t.muted}}">travail</span>
      </div>
      <div style="height: 1px; margin: 0 16px; background: {{t.line}}"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 0 8px 0 16px">
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 15px; font-weight: 500">Connexion</span>
          <span style="font-size: 13px; color: {{t.muted}}">hermes.maison.lan</span>
        </span>
        <button type="button" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; background: {{t.chip}}; color: {{t.text}}">Changer</button>
      </div>
      <div style="height: 1px; margin: 0 16px; background: {{t.line}}"></div>
      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px">
        <span style="font-size: 15px; font-weight: 500">Tous les profils</span>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: {{t.muted}}"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#1F7AE0","options":["#5A62F8","#1F7AE0","#00897B","#E25C12"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#0E1013', surface: '#171A1F', chip: '#22262C', line: '#2A2F36', text: '#EEF0F3', muted: '#9AA3AE' }
      : { bg: '#F7F8FA', surface: '#FFFFFF', chip: '#EDEFF2', line: '#E3E6EA', text: '#111418', muted: '#5B6470' };
    const accent = (this.state && this.state.accent) || this.props.accent || '#1F7AE0';
    const palette = [
      ['#5A62F8', 'Indigo'], ['#1F7AE0', 'Bleu'], ['#7958F5', 'Violet'],
      ['#00897B', 'Sarcelle'], ['#E25C12', 'Orange'], ['#D63A74', 'Framboise'],
    ];
    return {
      t,
      accent,
      tint: accent + (dark ? '33' : '1F'),
      swatches: palette.map(([color, label]) => ({
        color,
        label,
        selected: color === accent ? 'true' : 'false',
        ring: color === accent ? 'box-shadow: 0 0 0 3px ' + t.surface + ', 0 0 0 5px ' + color : '',
        pick: () => this.setState({ accent: color }),
      })),
    };
  }
}
</script>
</body>
</html>
