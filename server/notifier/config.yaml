version: "0.1.2"
slug: "hermes_notifier"
name: "Hermes Notifier"
description: "Observateur des fins de travail Hermes, outbox durable et santé, en lecture seule."
url: "https://github.com/alanmlcrt/hermes-mobile/tree/main/server/notifier"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# Réseau hôte, écoute sur 127.0.0.1:8787 seulement (run.sh) : Tailscale Services
# (add-on Tailscale, cibles limitées à 127.0.0.1) publie l'API en HTTPS sur le
# tailnet. Aucun port publié ; pas de watchdog TCP, le Supervisor ne joint pas
# la boucle locale de l'hôte.
host_network: true
# `/data` est toujours monté par le Supervisor, en lecture-écriture et sans
# Le dossier share est monté en lecture seule pour le compte de service privé.
map:
  - type: share
    read_only: true
options:
  environment: integration
  hermes_origin: ""
  hermes_username: hermes
  hermes_password: ""
  hermes_profile: ""
  bearer_hash: ""
  bearer_salt: ""
  fcm_enabled: false
  fcm_service_account: ""
  log_level: info
  rate_limit_per_minute: 120
schema:
  environment: "list(fixtures|integration|personal)"
  hermes_origin: "str"
  hermes_username: "str"
  hermes_password: "password"
  hermes_profile: "str?"
  # Valeur vide permise pour que l'add-on s'installe et refuse au démarrage
  # avec un code borné, plutôt que d'être rejeté par le schéma Supervisor.
  bearer_hash: "match(^$|^[0-9a-f]{64}$)"
  bearer_salt: "match(^$|^[0-9a-f]{64,128}$)"
  fcm_enabled: "bool"
  fcm_service_account: "str?"
  log_level: "list(debug|info|warning|error)"
  rate_limit_per_minute: "int(1,10000)"
