name: hermes-mobile-notify
version: "1.0.3"
description: Hermes Mobile - notification FCM générique à chaque fin de tour (aucun contenu) ; commande /hermes-mobile-token.
author: Hermes Mobile
homepage: https://github.com/alanmlcrt/hermes-mobile/tree/master/server/hermes-plugin/hermes-mobile-notify
hooks:
  - on_session_end
provides_hooks:
  - on_session_end
config_schema:
  service_account_json:
    type: secret
    env: HERMES_MOBILE_SERVICE_ACCOUNT_JSON
    label: Compte de service Firebase
    description: >-
      Contenu JSON du compte de service Firebase, ou le même JSON encodé en
      base64. Laisser vide pour lire HERMES_HOME/hermes-mobile/service-account.json.
