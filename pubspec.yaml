name: hermes_mobile
description: "Interface mobile personnelle pour l'installation Hermes d'Alanc."
publish_to: 'none'
version: 0.1.0+34

environment:
  sdk: ^3.13.5

# Versions exactes, résolues ensemble ; pubspec.lock est commité.
dependencies:
  flutter:
    sdk: flutter
  dynamic_color: 2.1.0
  # Type ColorScheme fourni par dynamic_color 2.1.0 (voir lib/ui/dynamic_color_bridge.dart).
  material_ui: 1.8.0
  sqflite: 2.4.4+2
  flutter_secure_storage: 11.2.0
  http: 1.6.0
  crypto: 3.0.7
  web_socket_channel: 3.0.3
  go_router: 18.1.1
  flutter_markdown_plus: 1.0.12
  file_picker: 13.1.0
  path_provider: 2.1.6
  open_filex: 5.0.0
  mime: 2.0.0
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - contracts/event-mapping.json
    - contracts/file-limits.json
  # Inter (OFL, assets/fonts/OFL.txt), sous-ensemble latin.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-400.ttf
        - asset: assets/fonts/inter-500.ttf
          weight: 500
        - asset: assets/fonts/inter-600.ttf
          weight: 600
        - asset: assets/fonts/inter-700.ttf
          weight: 700
